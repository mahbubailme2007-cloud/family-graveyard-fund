<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Graveyard Fund</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
tailwind.config={theme:{extend:{colors:{bg:'var(--bg)',card:'var(--card)',ink:'var(--ink)',mut:'var(--mut)',line:'var(--line)',pri:'var(--pri)',soft:'var(--soft)',onpri:'var(--onpri)',gold:'var(--gold)'}}}}
</script>
<style>
:root{--bg:#f7f4ec;--card:#ffffff;--ink:#1f2a24;--mut:#667064;--line:#e4dfd0;--pri:#2f6b4f;--soft:#e6f0e9;--onpri:#ffffff;--gold:#9a7a3a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111714;--card:#19211c;--ink:#e8ede9;--mut:#9aa89d;--line:#2a352e;--pri:#6fbd96;--soft:#1f2f26;--onpri:#0e1511;--gold:#d2b36b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111714;--card:#19211c;--ink:#e8ede9;--mut:#9aa89d;--line:#2a352e;--pri:#6fbd96;--soft:#1f2f26;--onpri:#0e1511;--gold:#d2b36b;color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:40}
.ar{font-family:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;direction:rtl}
.pat{background-image:radial-gradient(circle at 20px 20px,rgba(255,255,255,.08) 2px,transparent 3px),linear-gradient(135deg,#1f4d38,#2f6b4f 55%,#6b8f5e);background-size:40px 40px,100% 100%}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useMemo}=React;
const html=htm.bind(React.createElement);
const L=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const mk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
const CUR=mk(new Date());
const shift=(m,n)=>{const[y,mo]=m.split("-").map(Number);return mk(new Date(y,mo-1+n,1))};
const range=(a,b)=>{const r=[];let m=a;while(m<=b&&r.length<120){r.push(m);m=shift(m,1)}return r};
const mname=m=>{const[y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleString("en",{month:"long",year:"numeric"})};
const tk=n=>"৳"+Number(n||0).toLocaleString("en");
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9);

const names=["Abdul Karim","Rahima Begum","Saikat Ahmed","Nazmul Hasan","Ayesha Siddika","Kamal Uddin","Shirin Akter","Tanvir Hossain"];
const seed=()=>names.map((n,i)=>{const joined=shift(CUR,-(2+i%4));const pay={};range(joined,CUR).forEach((m,j)=>{const paid=m===CUR?i%3!==0:(i+j)%5!==0;pay[m]=paid?{paid:true,date:m+"-0"+(2+(i+j)%7),note:i%2?"bKash TrxID 8K"+(4000+i*37+j):"Cash"}:{paid:false}});return{id:uid(),name:n,phone:"01"+(711000000+i*1234567),fee:500,joined,pay}});
const DEF={title:"Family Graveyard Fund",tag:"Sadaqah Jariyah for our beloved departed",heroTitle:"A lasting charity for those who came before us",heroText:"Together we keep our family graveyard clean, safe and cared for, so that every prayer and every contribution continues to bring reward.",video:"",gallery:"",story:"Our family graveyard has been the final resting place of our elders for generations. In order to maintain the grounds, boundary wall, pathways and greenery, family members agreed to a small monthly contribution that is collected and tracked openly.",founded:"1 January 2024",purpose:"Cleaning and upkeep, boundary repair, tree care, and arranging dua gatherings.",rules:"Monthly fee is 500 BDT per member.\nPay before the 10th of every month.\nAlways note your payment reference for the record.\nAccounts are open to every contributing family member.",pay:[{id:"p1",type:"bKash",name:"Saikat",num:"01975-025988"},{id:"p2",type:"Nagad",name:"Saikat",num:"01975-025988"}],pw:"admin123",upd:today()};
const NOTICES=[{id:"n1",title:"Monthly payment reminder",body:"Please pay your 500 BDT monthly contribution before the 10th of every month.",date:today(),pin:true},{id:"n2",title:"Bank deposit update",body:"Bank deposits are now reconciled every Friday. Share your transaction ID after paying.",date:today(),pin:false}];

const inp="mt-1 w-full rounded-lg border border-line bg-card px-3 py-2 text-ink outline-none focus:ring-2 focus:ring-pri";
const btn="inline-flex items-center justify-center gap-1 rounded-lg px-3 py-2 text-sm font-medium transition active:scale-95";
const pri=btn+" bg-pri text-onpri hover:opacity-90";
const ghost=btn+" border border-line bg-card text-ink hover:bg-soft";
const danger=btn+" border border-red-300 text-red-600 hover:bg-red-50";
const card="rounded-2xl border border-line bg-card p-4 sm:p-5 shadow-sm";

const Field=({label,...p})=>html`<label className="block text-sm"><span className="text-mut">${label}</span><input className=${inp} ...${p}/></label>`;
const Area=({label,...p})=>html`<label className="block text-sm"><span className="text-mut">${label}</span><textarea rows="3" className=${inp} ...${p}/></label>`;
const Modal=({title,onClose,children})=>html`<div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 p-3" onClick=${onClose}><div className="max-h-[90vh] w-full max-w-md overflow-y-auto rounded-2xl bg-card p-5 text-ink shadow-xl" onClick=${e=>e.stopPropagation()}><div className="mb-3 flex items-center justify-between"><h3 className="text-lg font-semibold">${title}</h3><button className="text-mut text-2xl leading-none" onClick=${onClose}>×</button></div>${children}</div></div>`;
const Badge=({paid})=>html`<span className=${"inline-block rounded-full px-2.5 py-0.5 text-xs font-semibold "+(paid?"bg-green-100 text-green-800":"bg-red-100 text-red-700")}>${paid?"Paid":"Due"}</span>`;

function App(){
  const[cfg,setCfg]=useState(()=>L("gf_cfg",DEF));
  const[members,setMembers]=useState(()=>L("gf_members",null)||seed());
  const[notices,setNotices]=useState(()=>L("gf_notices",NOTICES));
  const[admin,setAdmin]=useState(false);
  const[modal,setModal]=useState(null);
  const[tab,setTab]=useState("site");
  const[month,setMonth]=useState(CUR);
  const[q,setQ]=useState("");
  const[flt,setFlt]=useState("all");
  const[pw,setPw]=useState("");
  const[err,setErr]=useState("");
  useEffect(()=>S("gf_cfg",cfg),[cfg]);
  useEffect(()=>S("gf_members",members),[members]);
  useEffect(()=>S("gf_notices",notices),[notices]);
  const touch=()=>setCfg(c=>({...c,upd:today()}));

  const st=useMemo(()=>{
    let mo=0,life=0,due=0,dueCount=0;
    members.forEach(m=>{range(m.joined,CUR).forEach(x=>{const p=m.pay[x];if(p&&p.paid){life+=m.fee;if(x===CUR)mo+=m.fee}else{due+=m.fee;if(x===CUR)dueCount++}})});
    return{mo,life,due,dueCount};
  },[members]);

  const rows=members.filter(m=>m.joined<=month).filter(m=>m.name.toLowerCase().includes(q.toLowerCase())||m.phone.includes(q)).filter(m=>{const p=!!(m.pay[month]&&m.pay[month].paid);return flt==="all"||(flt==="paid")===p});
  const monthOpts=range(shift(CUR,-11),CUR).reverse();

  const toggle=id=>{setMembers(ms=>ms.map(m=>{if(m.id!==id)return m;const p=m.pay[month]&&m.pay[month].paid;return{...m,pay:{...m.pay,[month]:p?{paid:false}:{paid:true,date:today(),note:"Marked by admin"}}}}));touch()};
  const saveMember=f=>{
    const m={id:f.id||uid(),name:f.name.trim(),phone:f.phone.trim(),fee:Number(f.fee)||500,joined:f.joined||CUR,pay:f.pay||{}};
    if(!m.name)return;
    setMembers(ms=>f.id?ms.map(x=>x.id===m.id?{...x,...m,pay:x.pay}:x):[...ms,m]);touch();setModal(null)};
  const delMember=id=>{if(confirm("Delete this member?")){setMembers(ms=>ms.filter(m=>m.id!==id));touch()}};
  const login=()=>{if(pw===cfg.pw){setAdmin(true);setModal(null);setPw("");setErr("")}else setErr("Incorrect password")};
  const set=k=>e=>setCfg({...cfg,[k]:e.target.value});

  const gallery=cfg.gallery.split("\n").map(s=>s.trim()).filter(Boolean);
  const nav=[["about","About"],["notices","Notices"],["dashboard","Dashboard"],["pay","How to pay"]];

  return html`<div>
  <header className="sticky z-30 border-b border-line bg-card/95 backdrop-blur" style=${{top:"env(safe-area-inset-top,0px)"}}>
    <div className="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
      <a href="#top" className="flex items-center gap-2 font-semibold text-pri"><span className="grid h-9 w-9 place-items-center rounded-full bg-pri text-onpri">☪</span><span className="leading-tight">${cfg.title}</span></a>
      <nav className="hidden gap-5 text-sm text-mut md:flex">${nav.map(([h,t])=>html`<a key=${h} href=${"#"+h} className="hover:text-pri">${t}</a>`)}</nav>
      ${admin?html`<button className=${ghost} onClick=${()=>setAdmin(false)}>Exit admin</button>`:html`<button className=${pri} onClick=${()=>setModal("login")}>Admin access</button>`}
    </div>
    <nav className="flex gap-4 overflow-x-auto border-t border-line px-4 py-2 text-sm text-mut md:hidden">${nav.map(([h,t])=>html`<a key=${h} href=${"#"+h} className="whitespace-nowrap">${t}</a>`)}</nav>
  </header>

  <section id="top" className="pat relative overflow-hidden text-white">
    ${cfg.video&&html`<video className="absolute inset-0 h-full w-full object-cover" src=${cfg.video} autoPlay muted loop playsInline onError=${e=>e.target.style.display="none"}/>`}
    <div className="absolute inset-0 bg-black/45"></div>
    <div className="relative mx-auto max-w-4xl px-4 py-16 text-center sm:py-24">
      <p className="mb-3 text-sm uppercase tracking-widest text-white/80">${cfg.tag}</p>
      <h1 className="text-3xl font-bold sm:text-5xl">${cfg.heroTitle}</h1>
      <p className="mx-auto mt-4 max-w-2xl text-white/90">${cfg.heroText}</p>
      <div className="mx-auto mt-6 max-w-xl rounded-2xl border border-white/25 bg-white/10 p-4 backdrop-blur">
        <p className="ar text-xl">إِذَا مَاتَ الإِنْسَانُ انْقَطَعَ عَنْهُ عَمَلُهُ إِلاَّ مِنْ ثَلاَثَةٍ: صَدَقَةٍ جَارِيَةٍ…</p>
        <p className="mt-2 text-sm italic">“When a person dies, his deeds end except three: ongoing charity (Sadaqah Jariyah), beneficial knowledge, or a righteous child who prays for him.” — Sahih Muslim</p>
      </div>
      <a href="#dashboard" className=${btn+" mt-6 bg-white px-5 text-[#1f4d38] hover:opacity-90"}>View contributions</a>
    </div>
  </section>

  <main className="mx-auto max-w-6xl space-y-10 px-4 py-8">
    <section id="about" className="grid gap-4 md:grid-cols-3">
      <div className=${card+" md:col-span-2"}>
        <h2 className="mb-2 text-xl font-semibold text-pri">Our story</h2>
        <p className="text-mut">${cfg.story}</p>
        <div className="mt-4 grid gap-3 sm:grid-cols-2">
          <div className="rounded-xl bg-soft p-3"><p className="text-xs text-mut">Founded</p><p className="font-medium">${cfg.founded}</p></div>
          <div className="rounded-xl bg-soft p-3"><p className="text-xs text-mut">Purpose</p><p className="text-sm">${cfg.purpose}</p></div>
        </div>
        <div className="mt-4 grid grid-cols-3 gap-2">${[0,1,2].map(i=>gallery[i]?html`<img key=${i} src=${gallery[i]} alt="Graveyard" className="h-24 w-full rounded-xl object-cover sm:h-32" onError=${e=>e.target.style.visibility="hidden"}/>`:html`<div key=${i} className="pat grid h-24 place-items-center rounded-xl text-2xl text-white/70 sm:h-32">🌿</div>`)}</div>
      </div>
      <div className=${card}>
        <h2 className="mb-2 text-xl font-semibold text-pri">Rules & notices</h2>
        <ul className="space-y-2 text-sm text-mut">${cfg.rules.split("\n").filter(Boolean).map((r,i)=>html`<li key=${i} className="flex gap-2"><span className="text-gold">◆</span><span>${r}</span></li>`)}</ul>
      </div>
    </section>

    <section id="notices">
      <h2 className="mb-3 text-xl font-semibold text-pri">Notice board</h2>
      <div className="grid gap-3 md:grid-cols-2">${notices.length===0&&html`<p className="text-mut">No notices right now.</p>`}${[...notices].sort((a,b)=>b.pin-a.pin).map(n=>html`<div key=${n.id} className=${card+" border-l-4 "+(n.pin?"border-l-[color:var(--gold)]":"border-l-[color:var(--pri)]")}><div className="flex items-start justify-between gap-2"><h3 className="font-semibold">${n.pin?"📌 ":""}${n.title}</h3><span className="whitespace-nowrap text-xs text-mut">${n.date}</span></div><p className="mt-1 text-sm text-mut">${n.body}</p></div>`)}</div>
    </section>

    <section id="dashboard">
      <div className="mb-3 flex flex-wrap items-end justify-between gap-2"><h2 className="text-xl font-semibold text-pri">Fund dashboard</h2><p className="text-xs text-mut">Last updated: ${cfg.upd}</p></div>
      <div className="grid grid-cols-2 gap-3 lg:grid-cols-4">
        ${[["Collected this month",tk(st.mo),"text-pri"],["Lifetime collected",tk(st.life),"text-pri"],["Outstanding dues",tk(st.due),"text-red-600"],["Active members",members.length,"text-gold"]].map(([l,v,c])=>html`<div key=${l} className=${card}><p className="text-xs text-mut">${l}</p><p className=${"mt-1 text-2xl font-bold "+c}>${v}</p></div>`)}
      </div>

      <div className=${card+" mt-4"}>
        <div className="mb-3 flex flex-col gap-2 sm:flex-row">
          <input className=${inp+" mt-0 sm:flex-1"} placeholder="Search by name or mobile…" value=${q} onChange=${e=>setQ(e.target.value)}/>
          <select className=${inp+" mt-0 sm:w-48"} value=${month} onChange=${e=>setMonth(e.target.value)}>${monthOpts.map(m=>html`<option key=${m} value=${m}>${mname(m)}</option>`)}</select>
          <select className=${inp+" mt-0 sm:w-36"} value=${flt} onChange=${e=>setFlt(e.target.value)}><option value="all">All</option><option value="paid">Paid</option><option value="due">Due</option></select>
          ${admin&&html`<button className=${pri} onClick=${()=>setModal({t:"member",f:{name:"",phone:"",fee:500,joined:CUR}})}>+ Add member</button>`}
        </div>
        <div className="overflow-x-auto">
          <table className="w-full min-w-[720px] text-left text-sm">
            <thead className="border-b border-line text-xs uppercase text-mut"><tr>${["Member","Mobile","Fee","Status","Paid on","Transaction / notes"].map(h=>html`<th key=${h} className="px-2 py-2">${h}</th>`)}${admin&&html`<th className="px-2 py-2">Actions</th>`}</tr></thead>
            <tbody>${rows.map(m=>{const p=m.pay[month]||{paid:false};return html`<tr key=${m.id} className="border-b border-line last:border-0">
              <td className="px-2 py-3 font-medium">${m.name}</td><td className="px-2 py-3 text-mut">${m.phone}</td><td className="px-2 py-3">${tk(m.fee)}</td>
              <td className="px-2 py-3"><${Badge} paid=${p.paid}/></td><td className="px-2 py-3 text-mut">${p.paid?p.date:"—"}</td><td className="px-2 py-3 text-mut">${p.paid?p.note:"—"}</td>
              ${admin&&html`<td className="px-2 py-2"><div className="flex gap-1"><button className=${ghost} onClick=${()=>toggle(m.id)}>${p.paid?"Mark due":"Mark paid"}</button><button className=${ghost} onClick=${()=>setModal({t:"member",f:m})}>Edit</button><button className=${danger} onClick=${()=>delMember(m.id)}>Delete</button></div></td>`}
            </tr>`})}</tbody>
          </table>
          ${rows.length===0&&html`<p className="py-6 text-center text-mut">No members match.</p>`}
        </div>
      </div>
    </section>

    <section id="pay" className=${card}>
      <h2 className="mb-3 text-xl font-semibold text-pri">How to pay</h2>
      <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">${cfg.pay.map(a=>html`<div key=${a.id} className="rounded-xl bg-soft p-3"><p className="text-xs uppercase text-mut">${a.type}</p><p className="font-semibold">${a.name}: ${a.num}</p></div>`)}</div>
      <p className="mt-3 text-sm text-mut">Send your monthly contribution and share the transaction ID with the committee so it can be recorded.</p>
    </section>

    ${admin&&html`<section className=${card+" border-2 border-pri"}>
      <div className="mb-3 flex flex-wrap items-center gap-2"><h2 className="mr-auto text-xl font-semibold text-pri">Admin panel</h2>${[["site","Site content"],["notices","Notices"],["accounts","Payment accounts"],["sec","Security"]].map(([k,t])=>html`<button key=${k} className=${tab===k?pri:ghost} onClick=${()=>setTab(k)}>${t}</button>`)}</div>
      ${tab==="site"&&html`<div className="grid gap-3 md:grid-cols-2">
        <${Field} label="Site title" value=${cfg.title} onChange=${set("title")}/><${Field} label="Tagline" value=${cfg.tag} onChange=${set("tag")}/>
        <${Field} label="Hero headline" value=${cfg.heroTitle} onChange=${set("heroTitle")}/><${Field} label="Foundation date" value=${cfg.founded} onChange=${set("founded")}/>
        <${Area} label="Hero description" value=${cfg.heroText} onChange=${set("heroText")}/><${Area} label="Story" value=${cfg.story} onChange=${set("story")}/>
        <${Area} label="Purpose" value=${cfg.purpose} onChange=${set("purpose")}/><${Area} label="Rules (one per line)" value=${cfg.rules} onChange=${set("rules")}/>
        <${Field} label="Hero background video URL (mp4)" value=${cfg.video} onChange=${set("video")} placeholder="https://…/graveyard.mp4"/><${Area} label="Photo URLs (one per line)" value=${cfg.gallery} onChange=${set("gallery")}/>
      </div>`}
      ${tab==="notices"&&html`<div className="space-y-2"><button className=${pri} onClick=${()=>setModal({t:"notice",f:{title:"",body:"",pin:false}})}>+ New notice</button>${notices.map(n=>html`<div key=${n.id} className="flex items-center justify-between gap-2 rounded-xl bg-soft p-3"><span className="text-sm font-medium">${n.title}</span><span className="flex gap-1"><button className=${ghost} onClick=${()=>setModal({t:"notice",f:n})}>Edit</button><button className=${danger} onClick=${()=>setNotices(notices.filter(x=>x.id!==n.id))}>Remove</button></span></div>`)}</div>`}
      ${tab==="accounts"&&html`<div className="space-y-2">${cfg.pay.map((a,i)=>html`<div key=${a.id} className="grid grid-cols-2 gap-2 sm:grid-cols-4"><${Field} label="Type" value=${a.type} onChange=${e=>setCfg({...cfg,pay:cfg.pay.map((x,j)=>j===i?{...x,type:e.target.value}:x)})}/><${Field} label="Holder" value=${a.name} onChange=${e=>setCfg({...cfg,pay:cfg.pay.map((x,j)=>j===i?{...x,name:e.target.value}:x)})}/><${Field} label="Number" value=${a.num} onChange=${e=>setCfg({...cfg,pay:cfg.pay.map((x,j)=>j===i?{...x,num:e.target.value}:x)})}/><button className=${danger+" self-end"} onClick=${()=>setCfg({...cfg,pay:cfg.pay.filter((_,j)=>j!==i)})}>Delete</button></div>`)}<button className=${pri} onClick=${()=>setCfg({...cfg,pay:[...cfg.pay,{id:uid(),type:"bKash",name:"",num:""}]})}>+ Add account</button></div>`}
      ${tab==="sec"&&html`<div className="max-w-sm space-y-3"><${Field} label="Admin password" value=${cfg.pw} onChange=${set("pw")}/><p className="text-xs text-mut">Demo only: this password is stored in your browser and is not real security. Connect a backend before using real data.</p><button className=${danger} onClick=${()=>{if(confirm("Reset all data to sample data?")){setCfg(DEF);setMembers(seed());setNotices(NOTICES)}}}>Reset to sample data</button></div>`}
    </section>`}
  </main>
  <footer className="border-t border-line py-6 text-center text-sm text-mut">${cfg.title} · May Allah accept our efforts and grant mercy to our departed.</footer>

  ${modal==="login"&&html`<${Modal} title="Admin access" onClose=${()=>{setModal(null);setErr("")}}><${Field} label="Password" type="password" value=${pw} onChange=${e=>setPw(e.target.value)} onKeyDown=${e=>e.key==="Enter"&&login()} placeholder="Default: admin123"/>${err&&html`<p className="mt-2 text-sm text-red-600">${err}</p>`}<button className=${pri+" mt-4 w-full"} onClick=${login}>Unlock</button><//>`}
  ${modal&&modal.t==="member"&&html`<${MemberForm} f=${modal.f} onSave=${saveMember} onClose=${()=>setModal(null)}/>`}
  ${modal&&modal.t==="notice"&&html`<${NoticeForm} f=${modal.f} onClose=${()=>setModal(null)} onSave=${n=>{setNotices(ns=>n.id?ns.map(x=>x.id===n.id?n:x):[{...n,id:uid(),date:today()},...ns]);setModal(null)}}/>`}
  </div>`;
}

function MemberForm({f,onSave,onClose}){
  const[v,setV]=useState(f);const s=k=>e=>setV({...v,[k]:e.target.value});
  return html`<${Modal} title=${f.id?"Edit member":"Add member"} onClose=${onClose}><div className="space-y-3">
    <${Field} label="Full name" value=${v.name} onChange=${s("name")}/><${Field} label="Mobile / contact" value=${v.phone} onChange=${s("phone")}/>
    <${Field} label="Monthly fee (BDT)" type="number" value=${v.fee} onChange=${s("fee")}/><${Field} label="Joined month" type="month" value=${v.joined} onChange=${s("joined")}/>
    <button className=${pri+" w-full"} onClick=${()=>onSave(v)}>Save member</button></div><//>`;
}
function NoticeForm({f,onSave,onClose}){
  const[v,setV]=useState(f);
  return html`<${Modal} title=${f.id?"Edit notice":"New notice"} onClose=${onClose}><div className="space-y-3">
    <${Field} label="Title" value=${v.title} onChange=${e=>setV({...v,title:e.target.value})}/><${Area} label="Message" value=${v.body} onChange=${e=>setV({...v,body:e.target.value})}/>
    <label className="flex items-center gap-2 text-sm"><input type="checkbox" checked=${v.pin} onChange=${e=>setV({...v,pin:e.target.checked})}/> Pin to top</label>
    <button className=${pri+" w-full"} onClick=${()=>v.title.trim()&&onSave(v)}>Save notice</button></div><//>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
